<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Outer ring -->
  <circle cx="100" cy="100" r="95" fill="none" stroke="#0C1A35" stroke-width="3"/>
  <circle cx="100" cy="100" r="88" fill="none" stroke="#0C1A35" stroke-width="1"/>
  <circle cx="100" cy="100" r="84" fill="none" stroke="#C8973A" stroke-width="2"/>
  <circle cx="100" cy="100" r="78" fill="none" stroke="#C8973A" stroke-width="0.8"/>

  <!-- Circular text: TOEFL ACADEMIC -->
  <path id="top-arc" d="M 20,100 A 80,80 0 0,1 180,100" fill="none"/>
  <text font-family="Georgia, serif" font-size="13.5" font-weight="bold" fill="#0C1A35" letter-spacing="4.5">
    <textPath href="#top-arc" startOffset="8%">TOEFL ACADEMIC</textPath>
  </text>

  <!-- Bottom circular text -->
  <path id="bottom-arc" d="M 28,108 A 74,74 0 0,0 172,108" fill="none"/>
  <text font-family="Georgia, serif" font-size="10" fill="#C8973A" letter-spacing="3.8">
    <textPath href="#bottom-arc" startOffset="12%">CEFR ALIGNED · EST. 2025</textPath>
  </text>

  <!-- Stars as separators -->
  <text x="100" y="175" font-family="serif" font-size="10" fill="#C8973A" text-anchor="middle" letter-spacing="12">★ ★</text>

  <!-- Inner emblem: graduation cap -->
  <!-- Cap board -->
  <polygon points="100,52 140,68 100,84 60,68" fill="#0C1A35" stroke="#C8973A" stroke-width="1"/>
  <!-- Cap base cylinder -->
  <rect x="79" y="68" width="42" height="16" rx="2" fill="#0C1A35"/>
  <!-- Tassel line -->
  <line x1="140" y1="68" x2="140" y2="88" stroke="#C8973A" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="140" cy="91" r="4" fill="#C8973A"/>

  <!-- Shield outline below cap -->
  <path d="M100,95 L118,103 L118,120 Q118,130 100,136 Q82,130 82,120 L82,103 Z" fill="none" stroke="#C8973A" stroke-width="1.5" opacity="0.7"/>

  <!-- Inner text -->
  <text x="100" y="115" font-family="Georgia, serif" font-size="9" font-weight="bold" fill="#0C1A35" text-anchor="middle" letter-spacing="1">OFFICIAL</text>
  <text x="100" y="126" font-family="Georgia, serif" font-size="7.5" fill="#C8973A" text-anchor="middle" letter-spacing="0.8">CERTIFICATION</text>

  <!-- Dashed inner border detail -->
  <circle cx="100" cy="100" r="72" fill="none" stroke="#0C1A35" stroke-width="0.5" stroke-dasharray="3,4" opacity="0.4"/>
</svg>
